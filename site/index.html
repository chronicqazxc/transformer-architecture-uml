<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decoder-only Transformer Study</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px system-ui, sans-serif; background: #f9fafb; color: #111827; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: #1f2937; color: #fff; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  button, select { font: inherit; padding: 4px 10px; border-radius: 4px; border: 1px solid #4b5563; background: #374151; color: #fff; cursor: pointer; }
  button:hover { background: #4b5563; }
  #gh { color: #fff; font-size: 13px; }
  #status { margin-left: auto; font-size: 12px; opacity: .8; }
  #preview { flex: 1; overflow: auto; padding: 16px; }
  #preview svg { display: block; margin: 0 auto; }
  #error { color: #b91c1c; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1 id="title">Decoder-only Transformer Study</h1>
  <select id="diagram" aria-label="Diagram"></select>
  <select id="lang" aria-label="Language">
    <option value="en">English</option><option value="zh-tw">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option>
  </select>
  <button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomFit">100%</button>
  <button id="svg">SVG</button>
  <a id="gh" href="https://github.com/chronicqazxc/transformer-architecture-uml" target="_blank" rel="noopener">GitHub</a>
  <span id="status" role="status">loading…</span>
</header>
<div id="preview"></div>

<script src="vendor/viz-global.js"></script>
<script type="module">
// PlantUML draws the source URL in header/footer as plain text; make it a real link.
function linkify(svg) {
  if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  svg.querySelectorAll('text').forEach((t) => {
    const m = t.textContent.match(/https:\/\/github\.com\/chronicqazxc\/transformer-architecture-uml\s*$/);
    if (!m) return;
    const url = m[0].trim();
    const a = document.createElementNS(NS, 'a');
    a.setAttribute('href', url); a.setAttribute('target', '_blank');
    a.style.cursor = 'pointer';
    t.parentNode.insertBefore(a, t); a.appendChild(t);
  });
}
import { renderToString } from './vendor/plantuml.js';

const $ = (id) => document.getElementById(id);
const preview = $('preview'), status = $('status'), langSel = $('lang'), diagSel = $('diagram');

// Fixed list of bundled diagrams (generated by transformer-study/bundle.py).
const DIAGRAMS = {
  plantuml_full:     { en: 'Generation / inference (full)', 'zh-tw': '生成 / 推論（完整）', ja: '生成 / 推論（全体）', ko: '생성 / 추론 (전체)' },
  plantuml_export:   { en: 'Generation / inference (overview)', 'zh-tw': '生成 / 推論（概覽）', ja: '生成 / 推論（概要）', ko: '생성 / 추론 (개요)' },
  plantuml_attention: { en: 'Attention (one layer)', 'zh-tw': '注意力（單層）', ja: 'Attention（1 層）', ko: 'Attention (한 레이어)' },
  plantuml_ffn:       { en: 'FFN (one layer)', 'zh-tw': 'FFN（單層）', ja: 'FFN（1 層）', ko: 'FFN (한 레이어)' },
  plantuml_training: { en: 'Training', 'zh-tw': '訓練', ja: '学習', ko: '학습' },
};
const LANGS = ['en', 'zh-tw', 'ja', 'ko'];
const TITLE = { en: 'Decoder-only Transformer Study', 'zh-tw': 'Decoder-only Transformer 學習', ja: 'Decoder-only Transformer 学習', ko: 'Decoder-only Transformer 학습' };

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const params = new URLSearchParams(location.search);
const pick = (v, allowed, fallback) => (allowed.includes(v) ? v : fallback);

langSel.value = pick(params.get('lang') ?? store.get('lang'), LANGS, 'en');
const names = Object.keys(DIAGRAMS);
let zoom = 1, seq = 0, lastSvg = '';
const sources = {};

function fillDiagrams() {
  const cur = diagSel.value || pick(params.get('d'), names, names[0]);
  diagSel.innerHTML = names.map((n) => `<option value="${n}">${DIAGRAMS[n][langSel.value]}</option>`).join('');
  diagSel.value = cur;
  $('title').textContent = TITLE[langSel.value];
  document.documentElement.lang = langSel.value === 'zh-tw' ? 'zh-Hant' : langSel.value;
}

// The bundle holds all four languages; its `!$lang = "xx"` line picks one.
const withLang = (src) => src.replace(/^(!\$lang\s*=\s*)"[\w-]+"/m, `$1"${langSel.value}"`);

async function refresh() {
  const id = ++seq;
  status.textContent = 'rendering…';
  try {
    const name = diagSel.value;
    sources[name] ??= await (await fetch(`bundle/${name}.puml`)).text();
    const toSvg = (src) => new Promise((ok, fail) => renderToString(src.split('\n'), ok, (e) => fail(new Error(String(e)))));
    // The browser build refuses images taller than 4096 px (the jar does not). If a diagram is too
    // tall in some language, retry with smaller note text rather than showing an error.
    let svg, src = withLang(sources[name]);
    for (let note = 9; ; note--) {
      try { svg = await toSvg(src.replace(/^(skinparam NoteFontSize )\d+/m, `$1${note}`)); break; }
      catch (e) { if (!/too large/i.test(e.message) || note <= 7) throw e; }
    }
    if (id !== seq) return;
    lastSvg = svg;
    preview.innerHTML = svg;
    linkify(preview.querySelector('svg'));
    applyZoom();
    status.textContent = '';
  } catch (e) {
    if (id !== seq) return;
    preview.innerHTML = '<div id="error"></div>';
    $('error').textContent = e.message;
    status.textContent = 'error';
  }
}
function applyZoom() {
  $('zoomFit').textContent = Math.round(zoom * 100) + '%';
  const s = preview.querySelector('svg'); if (!s) return;
  if (!s.dataset.w) {
    const b = s.getBoundingClientRect();
    s.dataset.w = parseFloat(s.getAttribute('width')) || b.width;
    s.dataset.h = parseFloat(s.getAttribute('height')) || b.height;
  }
  s.style.maxWidth = 'none';
  s.style.width = s.dataset.w * zoom + 'px';
  s.style.height = s.dataset.h * zoom + 'px';
}
function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set('lang', langSel.value); u.searchParams.set('d', diagSel.value);
  history.replaceState(null, '', u);
}

langSel.onchange = () => { store.set('lang', langSel.value); fillDiagrams(); syncUrl(); refresh(); };
diagSel.onchange = () => { syncUrl(); refresh(); };
$('zoomIn').onclick = () => { zoom *= 1.2; applyZoom(); };
$('zoomOut').onclick = () => { zoom /= 1.2; applyZoom(); };
$('zoomFit').onclick = () => { zoom = 1; applyZoom(); };
$('svg').onclick = () => {
  if (!lastSvg) return;
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([lastSvg], { type: 'image/svg+xml' })),
    download: `${diagSel.value}${langSel.value === 'en' ? '' : '.' + langSel.value}.svg`,
  });
  a.click(); URL.revokeObjectURL(a.href);
};

fillDiagrams();
refresh();
</script>
</body>
</html>
